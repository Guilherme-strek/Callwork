services:
  db:
    image: postgres:16-alpine
    container_name: callwork-db
    environment:
      POSTGRES_DB: callwork
      POSTGRES_USER: callwork
      POSTGRES_PASSWORD: callwork
    ports:
      - "5432:5432"
    volumes:
      - callwork_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callwork -d callwork"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: callwork-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/callwork
      DB_USER: callwork
      DB_PASSWORD: callwork
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"

volumes:
  callwork_pgdata:
