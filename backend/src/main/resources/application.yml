server:
  port: 8080

spring:
  application:
    name: callwork-api

  profiles:
    default: local

  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/callwork;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate          # o schema e gerido pelo Flyway, nao pelo Hibernate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# CORS: origem do front Angular em desenvolvimento
callwork:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

logging:
  level:
    org.hibernate.SQL: info
